# A generic, single database configuration.

[alembic]

# path to migration scripts
script_location = backend/alembic

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# prepend sys.path
prepend_sys_path = .

# timezone
#timezone = UTC


# database connection
sqlalchemy.url = sqlite:///./backend/app.db


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
level = NOTSET
class = StreamHandler
args = (sys.stderr,)


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S