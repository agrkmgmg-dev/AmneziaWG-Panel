<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>AmneziaWG Panel - Login</title>

    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

<div class="login-container">

    <h1>
        AmneziaWG Panel
    </h1>

    <h3>
        ورود مدیریت
    </h3>


    {% if error %}
    <p class="error">
        {{ error }}
    </p>
    {% endif %}


    <form method="post" action="/admin/login">

        <input
            type="text"
            name="username"
            placeholder="نام کاربری"
            required
        >

        <br>

        <input
            type="password"
            name="password"
            placeholder="رمز عبور"
            required
        >

        <br>

        <button type="submit">
            ورود
        </button>

    </form>

</div>

</body>

</html>
