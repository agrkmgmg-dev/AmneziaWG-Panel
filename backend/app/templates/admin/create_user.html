<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <title>
        ایجاد کاربر جدید - AmneziaWG Panel
    </title>

    <style>

        body{
            font-family:Tahoma,Arial,sans-serif;
            max-width:700px;
            margin:40px auto;
            background:#f5f5f5;
        }


        .card{
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }


        h2{
            margin-bottom:25px;
        }


        label{
            display:block;
            margin-top:15px;
            margin-bottom:6px;
            font-weight:bold;
        }


        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
        }


        .buttons{
            margin-top:25px;
        }


        button{
            padding:10px 20px;
            cursor:pointer;
            border:none;
            border-radius:6px;
        }


        a{
            margin-right:15px;
            text-decoration:none;
        }


        .error{
            background:#ffe5e5;
            color:#b00000;
            padding:10px;
            border-radius:6px;
            margin-bottom:20px;
        }


    </style>

</head>


<body>


<div class="card">


    <h2>
        ➕ ایجاد کاربر جدید
    </h2>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}



    <form method="post" action="/admin/users/create">


        <label>
            نام کاربری
        </label>


        <input
            type="text"
            name="username"
            placeholder="username"
            required
        >



        <label>
            رمز عبور
        </label>


        <input
            type="password"
            name="password"
            placeholder="password"
            required
        >



        <div class="buttons">


            <button type="submit">
                💾 ذخیره کاربر
            </button>


            <a href="/admin/users">
                ← بازگشت
            </a>


        </div>


    </form>


</div>


</body>

</html>
