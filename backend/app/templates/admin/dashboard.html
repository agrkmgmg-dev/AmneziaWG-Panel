<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>AmneziaWG Panel</title>

    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

<div class="container">

    <h1>پنل مدیریت AmneziaWG</h1>

    <div class="cards">

        <div class="card">
            <h2>Users</h2>
            <p>{{ users_count }}</p>
        </div>

        <div class="card">
            <h2>Peers</h2>
            <p>{{ peers_count }}</p>
        </div>

        <div class="card">
            <h2>Traffic</h2>
            <p>{{ traffic_count }}</p>
        </div>

        <div class="card">
            <h2>Logs</h2>
            <p>{{ logs_count }}</p>
        </div>

    </div>

</div>

</body>

</html>
