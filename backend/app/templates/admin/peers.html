<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>AmneziaWG Peers</title>
</head>

<body>

<h2>🔑 کلاینت‌های AmneziaWG</h2>

<p>
    <a href="/admin/peers/create">➕ ایجاد کلاینت جدید</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>IP</th>
        <th>Action</th>
    </tr>

    {% if peers %}

        {% for peer in peers %}

        <tr>

            <td>{{ peer.id }}</td>

            <td>{{ peer.name }}</td>

            <td>{{ peer.address }}</td>

            <td>

                <a href="/admin/peers/{{ peer.id }}/config">
                    ⬇️ کانفیگ
                </a>

                |

                <a href="/admin/peers/{{ peer.id }}/qr">
                    📱 QR
                </a>

                |

                <a href="/admin/peers/{{ peer.id }}/delete">
                    🗑 حذف
                </a>

            </td>

        </tr>

        {% endfor %}

    {% else %}

        <tr>
            <td colspan="4">
                هیچ کلاینتی وجود ندارد
            </td>
        </tr>

    {% endif %}

</table>

<br>

<a href="/admin/dashboard">
    ← بازگشت به داشبورد
</a>

</body>
</html>
